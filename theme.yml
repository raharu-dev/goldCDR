name: goldCDR
stylesheets:

    # Themes
  - file: th_goldcdr.css
    name: Theme | goldCDR
    description: The NEW main GoldSRC inspired theme. The more consistent one and overall better (WIP) 🛠️
  - file: th_goldcdrOLD.css
    name: Theme | GoldCDR [OLD]
    description: The OLD main GoldSRC inspired theme. [Please use recommended settings] 😉

    # Modifications to the theme
  - file: mod_disableambience.css
    name: Mod | Disable Ambience
    description: Disables the ambient background on Album/Playlist view (Works only on OLD currently) 🖼️
  - file: mod_uglyfonts.css
    name: Mod | Ugly Fonts
    description: Makes the usage of an old styled pixelated font (Probably only on Windows 🪟)
  - file: mod_digiphys.css
    name: Mod | Digital Physical 3D Effect
    description: Adds a 3D effect to the covers 💽
  - file: mod_dithering.css
    name: Mod | Cover Dithering
    description: Adds a dithering effect on covers to make them look low res and old 🧪

    # Color Schemes
  - file: cs_95.css
    name: Color Scheme | 95
    description: Changes the colors of goldCDR to look more like Windows 95 theme 🪟
  - file: cs_nier.css
    name: Color Scheme | NIER
    description: Changes the theme to look like NIER Automata UI 🤖 (Very Experimental 🧪) 
  - file: cs_oled.css 
    name: Color Scheme | OLED
    description: Changes the colors to more modern OLED high contrast theme if you like the style but not the colors 🖤
  - file: cs_transparent.css 
    name: Color Scheme | Transparent
    description: Changes the theme to work well with transparency 👓